{
  "$schema": "https://json.schemastore.org/github-issue-forms",
  "name": "Bug report",
  "title": "[Bug] ",
  "labels": ["bug"],
  "body": [
    {
      "type": "input",
      "id": "version",
      "attributes": { "label": "SDK version", "placeholder": "0.1.0" },
      "validations": { "required": true }
    },
    {
      "type": "input",
      "id": "runtime",
      "attributes": { "label": "Node version", "placeholder": "22.11.0" },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "call",
      "attributes": {
        "label": "Failing call",
        "description": "Minimal snippet. Never include real API keys.",
        "render": "typescript"
      },
      "validations": { "required": true }
    },
    {
      "type": "textarea",
      "id": "error",
      "attributes": {
        "label": "Error output",
        "description": "`OnepostlyError.code`, `status`, and `message`."
      },
      "validations": { "required": true }
    }
  ]
}
