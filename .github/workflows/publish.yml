name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC)
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21
      - run: npm ci
      # Release gate: regenerate from the live production OpenAPI document
      # and stop if the committed generated code no longer matches it.
      - run: npm run generate
      - name: Fail if generated code drifted from production spec
        run: |
          git diff --exit-code -- src/ \
            || { echo "::error::Production spec drifted from the committed generated SDK. Regenerate, review, and re-tag."; exit 1; }
      - run: npm run build
      - run: npm test
      - run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            npm install @onepostly/sdk@${{ github.ref_name }}
            ```
